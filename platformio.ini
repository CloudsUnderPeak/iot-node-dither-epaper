[platformio]
data_dir = build/latest/web

[env:firebeetle2_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32c6
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    ESP32Async/AsyncTCP @ 3.4.10
    ESP32Async/ESPAsyncWebServer @ 3.11.1
build_flags =
    -I build/.work/esp-generated
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D STATUS_LED_PIN=-1
    -D ENABLE_CONFIG_STORE_SELF_TEST=0
    -D ENABLE_WIFI_MODE_SELF_TEST=0
    -D ENABLE_EPAPER_PANEL_SELF_TEST=0
    -D ENABLE_EPAPER_REFRESH_SELF_TEST=0
