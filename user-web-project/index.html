<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dither Image Editor</title>
    <link rel="icon" href="assets/icons/app/favicon.ico" sizes="any">
    <link rel="stylesheet" href="assets/styles/base.css">
    <link rel="stylesheet" href="assets/styles/layout.css">
    <link rel="stylesheet" href="assets/styles/components.css">
    <link rel="stylesheet" href="assets/styles/themes.css">
    <link rel="stylesheet" href="assets/styles/device.css">
    <script>
        (function (app) {
            var state = 'loading';
            var progress = 5;
            var resourceTotal = 0;
            var resourceSettled = 0;
            var copy = {
                loading: 'Loading...',
                error: 'App could not be loaded.',
                reload: 'Reload'
            };
            var timeoutId = window.setTimeout(function () {
                fail();
            }, 60000);

            function elements() {
                return {
                    overlay: document.getElementById('app-loading'),
                    appNode: document.getElementById('app'),
                    message: document.getElementById('app-loading-message'),
                    progress: document.getElementById('app-loading-progress'),
                    progressBar: document.getElementById('app-loading-progress-bar'),
                    reload: document.getElementById('app-loading-reload')
                };
            }

            function bindReload(button) {
                if (!button || button.getAttribute('data-bound') === 'true') {
                    return;
                }
                button.setAttribute('data-bound', 'true');
                button.addEventListener('click', function () {
                    window.location.reload();
                });
            }

            function render() {
                var refs = elements();
                if (!refs.overlay || !refs.appNode) {
                    return;
                }
                bindReload(refs.reload);
                if (state === 'ready') {
                    refs.overlay.hidden = true;
                    refs.overlay.setAttribute('data-state', 'ready');
                    refs.overlay.setAttribute('aria-busy', 'false');
                    refs.appNode.removeAttribute('inert');
                    refs.appNode.removeAttribute('aria-hidden');
                    document.body.classList.remove('is-app-loading');
                    return;
                }
                document.body.classList.add('is-app-loading');
                refs.appNode.setAttribute('inert', '');
                refs.appNode.setAttribute('aria-hidden', 'true');
                refs.overlay.hidden = false;
                refs.overlay.setAttribute('data-state', state);
                refs.overlay.setAttribute('aria-busy', state === 'loading' ? 'true' : 'false');
                refs.overlay.setAttribute('role', state === 'error' ? 'alert' : 'status');
                refs.message.textContent = state === 'error'
                    ? copy.error
                    : copy.loading + ' ' + progress + '%';
                refs.progress.hidden = state !== 'loading';
                refs.progressBar.style.width = progress + '%';
                refs.progress.setAttribute('aria-valuenow', String(progress));
                refs.reload.textContent = copy.reload;
                refs.reload.hidden = state !== 'error';
                if (state === 'error') {
                    refs.reload.focus();
                }
            }

            function setCopy(nextCopy) {
                copy = Object.assign(copy, nextCopy || {});
                render();
            }

            function setProgress(nextProgress) {
                if (state !== 'loading') {
                    return;
                }
                progress = Math.max(progress, Math.min(100, Math.round(nextProgress)));
                render();
            }

            function registerResource() {
                resourceTotal += 1;
                setProgress(10);
            }

            function settleResource() {
                resourceSettled = Math.min(resourceSettled + 1, resourceTotal);
                setProgress(10 + Math.min(50, resourceSettled));
            }

            function fail() {
                if (state !== 'loading') {
                    return;
                }
                state = 'error';
                window.clearTimeout(timeoutId);
                render();
            }

            function complete() {
                if (state !== 'loading') {
                    return;
                }
                setProgress(100);
                state = 'ready';
                window.clearTimeout(timeoutId);
                render();
            }

            app.startupGate = {
                complete: complete,
                fail: fail,
                registerResource: registerResource,
                settleResource: settleResource,
                setCopy: setCopy,
                setProgress: setProgress,
                state: function currentState() {
                    return state;
                }
            };

            window.addEventListener('error', function (event) {
                var target = event.target;
                if (
                    !target
                    || target === window
                    || target.tagName === 'SCRIPT'
                    || (target.tagName === 'LINK' && target.rel === 'stylesheet')
                ) {
                    fail();
                }
            }, true);
            window.addEventListener('unhandledrejection', fail);
            document.addEventListener('DOMContentLoaded', render, { once: true });
        })(window.DitherApp = window.DitherApp || {});
    </script>
</head>
<body class="is-app-loading">
    <div
        id="app-loading"
        class="app-loading-overlay"
        data-state="loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
    >
        <div class="app-loading-content">
            <span class="app-loading-spinner" aria-hidden="true"></span>
            <div id="app-loading-message" class="app-loading-message">Loading... 5%</div>
            <div
                id="app-loading-progress"
                class="app-loading-progress"
                role="progressbar"
                aria-labelledby="app-loading-message"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="5"
            >
                <span id="app-loading-progress-bar" class="app-loading-progress-bar" style="width: 5%"></span>
            </div>
            <button id="app-loading-reload" class="secondary-button" type="button" hidden>Reload</button>
        </div>
    </div>
    <div id="app" class="app-shell" inert aria-hidden="true">
        <!-- app-shell 只提供 SPA 外殼；各頁內容會由 JavaScript 掛到 #page-host。 -->
        <header class="app-header">
            <div class="app-title">Dither Image Editor</div>
            <div class="app-header-actions">
                <div id="app-status" class="app-status is-busy" title="Loading..." aria-label="Loading..."></div>
                <button id="app-menu-button" class="icon-button app-menu-button button-with-icon" type="button" aria-label="Menu">
                    <span class="svg-icon app-menu-button-icon" data-svg-icon="assets/icons/editor/menu.svg"></span>
                    <span>Menu</span>
                </button>
            </div>
        </header>
        <main id="page-host" class="page-host"></main>
    </div>
